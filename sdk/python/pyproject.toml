[project]
name = "whp-decision-integrity-client"
version = "0.1.0"
description = "Python client for the Decision Integrity x402 v2 service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "x402[requests,evm]>=2.22.0",
  "requests>=2.31.0",
  "cryptography>=43.0.0",
]

[project.urls]
Homepage = "https://decision-integrity-service.wheelerhubbell.chatgpt.site"
Repository = "https://github.com/wheelerhubbell/DIP"
Documentation = "https://github.com/wheelerhubbell/DIP/blob/main/AGENTS.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whp_decision_integrity"]

[tool.hatch.build.targets.sdist]
include = ["src/whp_decision_integrity", "README.md", "pyproject.toml"]
