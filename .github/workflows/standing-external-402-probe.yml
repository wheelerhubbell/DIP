name: Standing direct x402 repair probe

on:
  push:
    branches:
      - standing-external-402-probe-20260916

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch repaired Standing branch
        run: |
          git init standing
          cd standing
          git remote add origin https://github.com/wheelerhubbell/WheelerHubbellPublishingStandingMark.git
          git fetch --depth 1 origin direct-x402-acquisition-20260916
          git checkout --detach FETCH_HEAD
      - name: Verify unsigned machine boundary and discovery hashes
        run: |
          cd standing
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {setup} from './test/fixtures.mjs';
          import {canonical,hash} from './src/canonical.mjs';
          import {publicMachineRoute,publicContract,publicOpenapi,publicResolution} from './src/public-machine.mjs';
          import {RESOLUTION_PATH} from './src/protocol.mjs';

          const a=await setup();
          try {
            const raw=canonical(a.f.submission);
            const unpaid=await publicMachineRoute(a.service,new Request('https://standing.test.invalid/v1/evaluations',{method:'POST',headers:{'content-type':'application/json'},body:raw}));
            assert.equal(unpaid.status,402);
            assert.ok(unpaid.headers.get('payment-required'));
            const terms=await unpaid.json();
            assert.equal(terms.x402Version,2);
            assert.equal(terms.extensions.bazaar.info.input.headers && Object.keys(terms.extensions.bazaar.info.input.headers).length,0);

            const c=publicContract(a.service);
            assert.equal(c.authentication.purchase,'NONE_BEYOND_X402_PAYMENT');
            assert.equal(c.authentication.retrieval,'NONE');
            assert.equal(c.purchase.whp_buyer_signature_required,false);

            const api=publicOpenapi(a.service);
            assert.equal(api.paths['/v1/evaluations'].post.security,undefined);
            assert.equal(api.paths['/v1/purchases/{purchase_id}/result'].get.security,undefined);
            assert.deepEqual(api.paths['/v1/reviews'].post.security,[{ClientProof:[]}]);

            const resolution=publicResolution(a.service);
            assert.equal(resolution.payload.service_contract.sha256,hash(c));
            assert.equal(resolution.payload.openapi.sha256,hash(api));
            const viaRoute=await publicMachineRoute(a.service,new Request('https://standing.test.invalid'+RESOLUTION_PATH));
            assert.equal(viaRoute.status,200);

            const initBody=JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list',params:{}});
            const mcp=await publicMachineRoute(a.service,new Request('https://standing.test.invalid/mcp',{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2025-11-25'},body:initBody}));
            assert.equal(mcp.status,200);
            const mcpData=JSON.parse(await mcp.text());
            const evalTool=mcpData.result.tools.find(t=>t.name==='whp_standing_evaluation');
            const resultTool=mcpData.result.tools.find(t=>t.name==='whp_standing_result');
            assert.ok(evalTool);
            assert.ok(resultTool);
            assert.equal(Object.hasOwn(evalTool.inputSchema.properties,'client_proof'),false);
            assert.equal(Object.hasOwn(resultTool.inputSchema.properties,'client_proof'),false);

            console.log(JSON.stringify({ok:true,unsigned_http_to_402:true,contract_hash_bound:true,openapi_hash_bound:true,mcp_client_proof_required:false,payment_sent:false,funds_moved:false},null,2));
          } finally { await a.store.close(); }
          NODE
