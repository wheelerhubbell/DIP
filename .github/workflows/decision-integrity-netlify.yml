name: Decision Integrity — independent free-host deployment
on:
  push:
    branches: [decision-integrity-netlify-20260913]
    paths: [decision-integrity-free-host.source.json]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore digest-verified service source
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          import {brotliDecompressSync} from 'node:zlib';
          import {dirname,resolve,sep} from 'node:path';
          import {createHash} from 'node:crypto';
          const bundle=JSON.parse(readFileSync('decision-integrity-free-host.source.json','utf8'));
          const encoded=bundle.parts.map(p=>readFileSync(p,'utf8').trim()).join('');
          const raw=brotliDecompressSync(Buffer.from(encoded,'base64'));
          if(createHash('sha256').update(raw).digest('hex')!==bundle.sha256)throw Error('Source digest mismatch');
          const files=JSON.parse(raw),root=resolve('free-host-copy');
          for(const [path,content] of Object.entries(files)){
            const target=resolve(root,path);if(!target.startsWith(root+sep))throw Error('Invalid path');
            mkdirSync(dirname(target),{recursive:true});writeFileSync(target,content);
          }
          NODE
      - name: Install pinned payment SDK and deployment client
        working-directory: free-host-copy
        run: npm install --no-audit --no-fund
      - name: Verify evaluator and fail-closed regression suite
        working-directory: free-host-copy
        run: npm test
      - name: Deploy independent Worker and test public endpoints
        working-directory: free-host-copy
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: node deploy-cloudflare.mjs
      - name: Retain encrypted ownership details and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-integrity-free-host-deployment
          path: |
            free-host-copy/deployment-private.enc.json
            free-host-copy/deployment-public.json
            free-host-copy/live-verification.json
            free-host-copy/test-results.json
          if-no-files-found: warn
          retention-days: 7
