name: Vertical Propagation Build

on:
  push:
    branches:
      - main
    paths:
      - 'data/verticals.json'
      - 'lib/verticals.ts'
      - 'app/industries/**'
      - 'app/sitemap.ts'
      - 'public/vertical-registry.schema.json'
      - '.github/workflows/vertical-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - run: npm run build
